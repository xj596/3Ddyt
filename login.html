<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D导演台 · 登录</title>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#1a1410; color:#e8d9c5; font-family:system-ui,-apple-system,"PingFang SC",sans-serif; }
    .card { width:min(420px,92vw); background:#241c14; border:1px solid #5a4a38; border-radius:16px; padding:28px; }
    h1 { margin:0 0 4px; font-size:22px; }
    .sub { color:#b8a890; font-size:13px; margin-bottom:20px; }
    label { display:block; font-size:13px; margin:12px 0 6px; color:#d8c8b0; }
    input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid #5a4a38;
      background:#1a1410; color:#e8d9c5; font-size:14px; }
    .btn { width:100%; margin-top:18px; padding:12px; border:none; border-radius:9px;
      background:#c8762e; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    .msg { margin-top:14px; font-size:13px; min-height:18px; }
    .msg.err { color:#e0746a; }
    .msg.ok { color:#7fc08a; }
    .tabs { display:flex; gap:8px; margin-bottom:8px; }
    .tab { flex:1; text-align:center; padding:9px; border-radius:9px; cursor:pointer; background:#2e2418; border:1px solid #5a4a38; }
    .tab.active { background:#c8762e; border-color:#c8762e; color:#fff; }
    a { color:#c8762e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>3D导演台</h1>
    <div class="sub">白模型镜头预可视化 · 登录后使用</div>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
    </div>

    <form id="auth-form" onsubmit="return doAuth(event)">
      <label>邮箱</label>
      <input type="email" id="email" required placeholder="you@example.com" />
      <label>密码</label>
      <input type="password" id="password" required minlength="6" placeholder="至少 6 位" />
      <button class="btn" type="submit" id="submit-btn">登录</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    // 跳转目标加固：只允许站内相对路径，缺扩展名自动补 .html
    // （修复：门控曾把 redirect 写成 studio，登录后落到 /studio → 404）
    function xfSafeRedirect(v) {
      v = String(v || '').trim();
      if (!v) return 'studio.html';
      if (/^(?:[a-z]+:)?\/\//i.test(v) || v.indexOf(':') >= 0) return 'studio.html';
      v = v.replace(/^\.?\//, '');
      if (!/\.[a-z0-9]{2,5}$/i.test(v)) v += '.html';
      return v;
    }

    let mode = 'login';
    function switchTab(m) {
      mode = m;
      document.getElementById('tab-login').classList.toggle('active', m === 'login');
      document.getElementById('tab-register').classList.toggle('active', m === 'register');
      document.getElementById('submit-btn').textContent = (m === 'login') ? '登录' : '注册并登录';
    }
    function setMsg(t, cls) { const el = document.getElementById('msg'); el.textContent = t; el.className = 'msg ' + (cls || ''); }

    async function doAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      setMsg('处理中…');
      try {
        if (mode === 'register') {
          await window.API.register(email, password);
        }
        await window.API.login(email, password);
        const params = new URLSearchParams(location.search);
        window.location.replace(xfSafeRedirect(params.get('redirect')));
      } catch (err) {
        setMsg(err.message || '操作失败', 'err');
      }
      return false;
    }

    // 已登录则直接进工作室
    (async () => {
      try { await window.API.me(); window.location.replace('studio.html'); } catch (e) {}
    })();
  </script>
</body>
</html>
